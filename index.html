<script type="module">
    import { cargarTemas } from "./js/temas.js";

    // Genera un gráfico geométrico o matemático limpio según el tema (sin imágenes externas ni aspecto de IA)
    function graficoPorTema(titulo = "", indice = 0) {
      const nombre = String(titulo).toLowerCase();
      const esRojo = indice % 2 === 0;
      const trazo = esRojo ? "#dc2626" : "#1e3a8a";
      const rellenoSuave = esRojo ? "#fef2f2" : "#eff6ff";

      // Geometría / Figuras / Espacial
      if (nombre.includes("geometr") || nombre.includes("espacial") || nombre.includes("triángul") || nombre.includes("figura")) {
        return `
          <svg viewBox="0 0 120 64" width="110" height="58" aria-hidden="true" style="margin-bottom: 6px;">
            <rect x="6" y="4" width="108" height="56" rx="10" fill="${rellenoSuave}" stroke="${trazo}" stroke-width="1.5" />
            <polygon points="34,48 56,14 78,48" fill="none" stroke="${trazo}" stroke-width="2.5" stroke-linejoin="round" />
            <line x1="56" y1="14" x2="56" y2="48" stroke="${trazo}" stroke-width="1.5" stroke-dasharray="3,2" />
            <circle cx="88" cy="24" r="9" fill="none" stroke="${trazo}" stroke-width="2" />
          </svg>
        `;
      }

      // Estadística / Probabilidad / Datos
      if (nombre.includes("estad") || nombre.includes("probab") || nombre.includes("datos") || nombre.includes("gráfic")) {
        return `
          <svg viewBox="0 0 120 64" width="110" height="58" aria-hidden="true" style="margin-bottom: 6px;">
            <rect x="6" y="4" width="108" height="56" rx="10" fill="${rellenoSuave}" stroke="${trazo}" stroke-width="1.5" />
            <line x1="24" y1="48" x2="96" y2="48" stroke="${trazo}" stroke-width="2" />
            <line x1="24" y1="16" x2="24" y2="48" stroke="${trazo}" stroke-width="2" />
            <rect x="34" y="32" width="12" height="16" fill="${trazo}" opacity="0.75" />
            <rect x="54" y="22" width="12" height="26" fill="${trazo}" opacity="0.9" />
            <rect x="74" y="27" width="12" height="21" fill="${trazo}" opacity="0.6" />
          </svg>
        `;
      }

      // Funciones / Álgebra / Cálculo / Trigonometría
      if (nombre.includes("func") || nombre.includes("álgebr") || nombre.includes("algebra") || nombre.includes("cálcul") || nombre.includes("calculo") || nombre.includes("trigon")) {
        return `
          <svg viewBox="0 0 120 64" width="110" height="58" aria-hidden="true" style="margin-bottom: 6px;">
            <rect x="6" y="4" width="108" height="56" rx="10" fill="${rellenoSuave}" stroke="${trazo}" stroke-width="1.5" />
            <line x1="20" y1="32" x2="100" y2="32" stroke="#94a3b8" stroke-width="1.5" />
            <line x1="60" y1="12" x2="60" y2="52" stroke="#94a3b8" stroke-width="1.5" />
            <path d="M 24,46 Q 60,8 96,46" fill="none" stroke="${trazo}" stroke-width="2.5" />
          </svg>
        `;
      }

      // Aritmética / Porcentajes / Razonamiento cuantitativo / General
      return `
        <svg viewBox="0 0 120 64" width="110" height="58" aria-hidden="true" style="margin-bottom: 6px;">
          <rect x="6" y="4" width="108" height="56" rx="10" fill="${rellenoSuave}" stroke="${trazo}" stroke-width="1.5" />
          <text x="60" y="39" text-anchor="middle" fill="${trazo}" font-size="22" font-weight="800" font-family="system-ui, sans-serif">
            f(x) · %
          </text>
        </svg>
      `;
    }

    async function iniciarMenu() {
      const rejilla = document.getElementById("rejilla");
      if (!rejilla) return;

      try {
        const temas = await cargarTemas();
        if (!Array.isArray(temas) || !temas.length) {
          rejilla.innerHTML = `<div class="tarjeta"><p>No hay módulos disponibles.</p></div>`;
          return;
        }

        rejilla.innerHTML = temas.map((t, i) => {
          const idTema = encodeURIComponent(t.id || t.carpeta);
          const titulo = t.titulo || t.carpeta || "Módulo";
          const totalPreguntas = Array.isArray(t.preguntas) ? t.preguntas.length : 0;
          const ilustracionTema = graficoPorTema(titulo, i);

          return `
            <article class="tarjeta">
              ${ilustracionTema}
              <span class="badge">TEMA</span>
              <h2>${titulo}</h2>
              <p class="subtitulo">${totalPreguntas > 0 ? `${totalPreguntas} preguntas` : "Práctica focalizada"}</p>
              <a href="prueba.html?tema=${idTema}" class="boton">Practicar tema</a>
            </article>
          `;
        }).join("");
      } catch (err) {
        rejilla.innerHTML = `<div class="tarjeta"><p>Error al cargar <code>indice.json</code>.</p></div>`;
      }
    }

    iniciarMenu();
  </script>
