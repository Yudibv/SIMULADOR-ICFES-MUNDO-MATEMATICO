<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador ICFES Saber 11 - Mundo Matemático</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabecera Institucional -->
  <header class="header-principal">
    <div class="logo-contenedor">
      <!-- Cambia 'logo.png' por el nombre exacto de tu archivo de imagen si es diferente -->
      <img src="img/logo.png" alt="Mundo Matemático" onerror="this.onerror=null; this.style.display='none'; document.getElementById('logo-texto-alternativo').style.display='inline';">
      <span id="logo-texto-alternativo" style="display:none; font-weight: 900; color: var(--azul); font-size: 1.2rem;">📐 MM</span>
      <h1 class="titulo-sitio">MUNDO MATEMÁTICO <span class="sub-saber">Saber 11</span></h1>
    </div>
    <nav>
      <a href="index.html" class="link-nav">Simulador Oficial</a>
    </nav>
  </header>

  <!-- Contenedor Principal que renderiza el Menú y las Tarjetas -->
  <main id="vista" class="contenedor-principal">
    <!-- El script de la aplicación cargará aquí las tarjetas de las competencias automáticamente -->
  </main>

  <!-- Pie de página -->
  <footer class="footer-principal">
    <p>Mundo Matemático • Educación y pre-universitario de alto rendimiento</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
